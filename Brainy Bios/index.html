<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainy Bios: Famous Personalities Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* === Updated Solid Color Theme === */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #7F27FF; /* main background */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #FFFFFF;
    }

    .container {
      background-color: #7F27FF;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(245, 229, 225, 0.3);
      width: 90%;
      max-width: 600px;
      text-align: center;
      border: 2px solid #F5E5E1;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #FFFFFF;
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #F5E5E1;
    }

    #question {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      color: #FFFFFF;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.75rem;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #F5E5E1;
      color: #7F27FF;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
      transform: scale(1.05);
    }

    .correct {
      background-color: #1feb1c !important;
      color: #7F27FF !important;
    }

    .wrong {
      background-color: #e60f0f !important;
      color: #7F27FF !important;
      opacity: 0.8;
    }

    #next-btn {
      background-color: #F5E5E1;
      color: #7F27FF;
      font-weight: bold;
      padding: 10px 20px;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    #next-btn:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Brainy Bios</h1>
    <h2>Famous Personalities Quiz</h2>
    <div id="quiz-container">
      <div id="question">Loading...</div>
      <div id="answer-buttons" class="btn-grid"></div>
      <button id="next-btn">Next</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
