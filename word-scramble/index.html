<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Word Scramble</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Global Styles */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #7F27FF; /* Solid background */
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #F5E5E1; /* Base container color */
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(255,255,255,0.3);
      text-align: center;
      max-width: 500px;
      width: 90%;
      color: #7F27FF;
    }

    h2 {
      color: #FFFFFF;
      text-shadow: 1px 1px 4px #F5E5E1;
      margin-bottom: 15px;
    }

    #scrambledWord {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #7F27FF;
    }

    #hint {
      color: #FFFFFF;
      margin-bottom: 10px;
    }

    input {
      font-size: 18px;
      text-align: center;
      width: 80%;
      padding: 8px;
      border-radius: 10px;
      border: 2px solid #7F27FF;
      margin-bottom: 10px;
    }

    button {
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 12px;
      border: 2px solid #7F27FF;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      font-weight: bold;
    }

    button.btn-primary {
      background-color: #FFFFFF;
      color: #7F27FF;
    }

    button.btn-primary:hover {
      background-color: #F5E5E1;
      transform: scale(1.05);
    }

    button.btn-success {
      background-color: #FFFFFF;
      color: #7F27FF;
    }

    button.btn-success:hover {
      background-color: #F5E5E1;
      transform: scale(1.05);
    }

    #feedback {
      margin-top: 15px;
      font-size: 1.2rem;
      min-height: 24px;
      transition: all 0.3s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container text-center my-5">
    <h2>🔤 Word Scramble</h2>
    <p class="fs-5" id="hint">Hint: </p>
    <h3 class="mb-4" id="scrambledWord">Jumbled</h3>
    <input type="text" id="userInput" class="form-control mx-auto" placeholder="Type the word..." />
    <button onclick="checkAnswer()" class="btn btn-primary mt-3">Check</button>
    <p id="feedback" class="mt-3 fs-5"></p>
    <button onclick="nextWord()" class="btn btn-success mt-2">Next</button>
  </div>

</body>
</html>
