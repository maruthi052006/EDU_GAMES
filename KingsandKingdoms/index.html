<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kings & Kingdoms Quest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* ===== GLOBAL COLOR THEME ===== */
    body {
      background-color: #7F27FF;
      color: #F5E5E1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-weight: bold;
      color: #F5E5E1;
      text-shadow: 0 0 10px rgba(245, 229, 225, 0.3);
    }

    #quizContainer {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 20px;
      padding: 30px;
      color: #F5E5E1;
      box-shadow: 0 0 25px rgba(245, 229, 225, 0.3);
      transition: all 0.3s ease-in-out;
    }

    #question {
      font-size: 1.4rem;
      color: #F5E5E1;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      background-color: transparent;
      border: 2px solid #F5E5E1;
      padding: 10px 15px;
      border-radius: 10px;
      margin: 10px auto;
      width: 90%;
      max-width: 500px;
      cursor: pointer;
      color: #F5E5E1;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .option:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    .option.correct {
      background-color: #F5E5E1 !important;
      color: #7F27FF !important;
      font-weight: bold;
    }

    .option.wrong {
      background-color: transparent !important;
      color: #F5E5E1 !important;
      border: 2px dashed #F5E5E1;
      opacity: 0.6;
      font-weight: bold;
    }

    #nextBtn {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 1.1rem;
      border-radius: 25px;
      background-color: transparent;
      border: 2px solid #F5E5E1;
      color: #F5E5E1;
      transition: 0.3s ease;
    }

    #nextBtn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    #resultText {
      font-size: 1.8rem;
      font-weight: bold;
      color: #F5E5E1;
    }
  </style>
</head>

<body>
  <div class="container my-5 text-center">
    <h1 class="mb-4">👑 Kings & Kingdoms Quest 👑</h1>

    <div id="quizContainer" class="p-4 shadow rounded">
      <h3 id="question" class="mb-4"></h3>
      <div id="options" class="mb-3"></div>
      <button id="nextBtn" class="btn">Next</button>
    </div>

    <div id="resultContainer" class="mt-5" style="display: none;">
      <h2 id="resultText"></h2>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
