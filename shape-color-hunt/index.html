<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎨 Shape & Color Hunt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      color: #F5E5E1;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(245, 229, 225, 0.3);
      width: 90%;
      max-width: 800px;
      text-align: center;
    }

    h2 {
      color: #F5E5E1;
      text-shadow: 1px 1px 4px #FFFFFF;
      margin-bottom: 20px;
    }

    #prompt {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #F5E5E1;
    }

    #feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #F5E5E1;
    }

    .shape-box {
      width: 80px;
      height: 80px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid #F5E5E1;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(245, 229, 225, 0.2);
    }

    .shape-box:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(245, 229, 225, 0.4);
    }

    .circle {
      border-radius: 50%;
      background-color: #F5E5E1;
    }

    .square {
      border-radius: 0;
      background-color: #F5E5E1;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 40px solid transparent;
      border-right: 40px solid transparent;
      border-bottom: 80px solid #F5E5E1;
      background: none;
    }

    button {
      margin-top: 20px;
      font-size: 1.1rem;
      padding: 10px 25px;
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body>
  <div class="container text-center my-5">
    <h2 class="display-5 fw-bold mb-4">🎨 Shape & Color Hunt</h2>
    <p id="prompt" class="fs-4 fw-semibold fade-in mb-3">Loading...</p>
    <div id="gameArea" class="d-flex flex-wrap justify-content-center gap-4 p-4"></div>
    <p id="feedback" class="fs-5 mt-3 fade-in"></p>
    <button onclick="nextChallenge()">Next</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
