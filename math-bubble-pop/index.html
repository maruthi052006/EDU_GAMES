<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎈 Math Bubble Pop Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #7F27FF;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      color: #FFFFFF;
    }

    .container {
      background-color: #F5E5E1;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      color: #7F27FF;
    }

    .fade-in {
      animation: fadeIn 1.2s ease-in;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    h2 {
      font-weight: 800;
      color: #7F27FF;
    }

    #bubble-area {
      min-height: 220px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .bubble {
      width: 90px;
      height: 90px;
      background-color: #7F27FF;
      border: 3px solid #F5E5E1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(255, 255, 255, 0.2);
    }

    .bubble:hover {
      transform: scale(1.15);
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }

    #result {
      margin-top: 15px;
      font-size: 1.2rem;
      transition: all 0.4s;
      color: #FFFFFF;
    }

    .btn-start {
      font-weight: 600;
      padding: 10px 30px;
      font-size: 18px;
      border-radius: 30px;
      background-color: #7F27FF;
      color: #FFFFFF;
      border: 2px solid #F5E5E1;
      transition: 0.3s;
    }

    .btn-start:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }
  </style>
</head>
<body>
  <div class="container text-center my-5 fade-in">
    <h2 class="mb-3">🎈 Math Bubble Pop Game 🎈</h2>
    <p id="question" class="fs-4 fw-bold">Loading question...</p>
    <div id="bubble-area"></div>
    <div id="result" class="mt-4 fs-5"></div>
    <button onclick="startGame()" class="btn btn-start mt-4">Start New Question</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
