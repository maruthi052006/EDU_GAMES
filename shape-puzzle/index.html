<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧩 Shape Puzzle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      color: #F5E5E1;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(245, 229, 225, 0.3);
      width: 90%;
      max-width: 800px;
      text-align: center;
    }

    h2 {
      color: #F5E5E1;
      text-shadow: 1px 1px 4px #FFFFFF;
      margin-bottom: 20px;
    }

    p {
      color: #F5E5E1;
    }

    .shape-slot {
      width: 100px;
      height: 100px;
      border: 2px dashed #F5E5E1;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      background-color: #7F27FF;
      transition: all 0.3s ease;
      font-size: 40px;
    }

    .shape-slot.matched {
      background-color: #F5E5E1;
      color: #7F27FF;
      font-size: 20px;
      font-weight: bold;
    }

    .draggable-shape {
      padding: 12px 24px;
      border: 2px solid #F5E5E1;
      border-radius: 12px;
      font-size: 18px;
      cursor: grab;
      user-select: none;
      background-color: #F5E5E1;
      color: #7F27FF;
      box-shadow: 2px 4px 12px rgba(245, 229, 225, 0.2);
      transition: transform 0.2s ease;
    }

    .draggable-shape:active {
      transform: scale(1.05);
    }

    #result {
      font-weight: 600;
      margin-top: 15px;
      transition: all 0.3s ease;
    }

    button {
      margin-top: 20px;
      font-size: 1.1rem;
      padding: 10px 25px;
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body>
  <div class="container text-center my-5 fade-in">
    <h2 class="display-5 fw-bold mb-4">🧩 Shape Puzzle</h2>
    <p class="fs-5">Drag each shape into its matching outline below</p>

    <div class="row justify-content-center mt-4">
      <div class="col-md-6 d-flex flex-wrap justify-content-center gap-4" id="dropZone"></div>
      <div class="col-md-4 d-flex flex-column align-items-center gap-3 mt-4 mt-md-0" id="dragZone"></div>
    </div>

    <p id="result" class="fs-5 mt-4"></p>
    <button onclick="resetGame()">Reset</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
