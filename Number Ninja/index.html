<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🥷 Number Ninja - Place Value Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #7F27FF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #F5E5E1;
    }

    .container {
      background-color: #7F27FF;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 12px 40px rgba(245, 229, 225, 0.4);
      max-width: 700px;
      width: 90%;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
      border: 3px solid #F5E5E1;
    }

    .title {
      font-size: 2.7rem;
      color: #F5E5E1;
      margin-bottom: 10px;
      text-shadow: 2px 2px 8px #FFFFFF;
    }

    .instructions {
      font-size: 1.2rem;
      color: #FFFFFF;
      margin-bottom: 30px;
    }

    .question-box {
      font-size: 1.7rem;
      margin-bottom: 20px;
      font-weight: bold;
      color: #F5E5E1;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .options button {
      padding: 12px 28px;
      font-size: 1.2rem;
      background-color: #F5E5E1;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      color: #7F27FF;
      font-weight: bold;
      box-shadow: 2px 2px 10px rgba(255,255,255,0.3);
    }

    .options button:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
      transform: scale(1.05);
    }

    #feedback {
      font-size: 1.4rem;
      font-weight: bold;
      margin-top: 15px;
      color: #F5E5E1;
    }

    #next {
      margin-top: 20px;
      font-size: 1.1rem;
      padding: 10px 20px;
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      border-radius: 10px;
      display: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #next:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">🥷 Number Ninja</h1>
    <p class="instructions">Can you slash the right place value?</p>

    <div class="question-box" id="question"></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
    <button id="next" onclick="loadNext()">Next ➡️</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
