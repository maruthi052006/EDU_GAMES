<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GK Galaxy: Quiz Across the Universe</title>
  <style>
    /* === THEME COLORS === */
    :root {
      --main-bg: #7F27FF;
      --accent: #F5E5E1;
      --text: #F5E5E1;
    }

    /* === PAGE BASE === */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--main-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* === QUIZ CONTAINER === */
    .quiz-container {
      background-color: var(--main-bg);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 30px 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 0 15px rgba(245, 229, 225, 0.3);
    }

    .title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(245, 229, 225, 0.3);
    }

    #question {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent);
    }

    /* === GRID OF ANSWER BUTTONS === */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
      background-color: var(--accent);
      color: var(--main-bg);
    }

    button:hover {
      background-color: var(--main-bg);
      color: var(--accent);
      transform: scale(1.05);
    }

    /* === NEXT BUTTON === */
    .next-btn {
      background-color: var(--accent);
      color: var(--main-bg);
      border: 2px solid var(--accent);
      transition: 0.3s;
    }

    .next-btn:hover {
      background-color: var(--main-bg);
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    /* === HIDDEN STATE === */
    .hidden {
      display: none;
    }

    /* === SCORE SECTION === */
    #score-section {
      color: var(--accent);
    }

    #score-section button {
      margin-top: 15px;
      background-color: var(--accent);
      color: var(--main-bg);
      border: 2px solid var(--accent);
    }

    #score-section button:hover {
      background-color: var(--main-bg);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1 class="title">🌌 GK Galaxy</h1>
    <div id="question-container">
      <div id="question">Loading question...</div>
      <div id="answer-buttons" class="btn-grid"></div>
    </div>
    <div class="controls">
      <button id="next-btn" class="next-btn">Next</button>
    </div>
    <div id="score-section" class="hidden">
      <h2>🧠 Quiz Completed!</h2>
      <p id="score-text"></p>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
