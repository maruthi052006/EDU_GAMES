<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Math Matching Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body.bg-matching {
      background-color: #7F27FF;
      font-family: 'Fredoka', sans-serif;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
    }

    .fade-in {
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .container {
      background-color: #F5E5E1;
      color: #7F27FF;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    .title-cinematic {
      font-weight: 700;
      color: #7F27FF;
      text-shadow: 1px 1px 0 #FFFFFF;
    }

    .glass-card {
      background-color: #F5E5E1;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
      padding: 20px;
    }

    h4 {
      color: #7F27FF;
    }

    #feedback {
      color: #7F27FF;
    }

    .match-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: 500;
      border-radius: 12px;
      background-color: #7F27FF;
      color: #FFFFFF;
      border: 2px solid #F5E5E1;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .match-btn:hover {
      transform: scale(1.05);
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }

    .selected {
      background-color: #F5E5E1 !important;
      color: #7F27FF !important;
    }

    .correct {
      background-color: #FFFFFF !important;
      color: #7F27FF !important;
    }

    .wrong {
      background-color: #F5E5E1 !important;
      color: #7F27FF !important;
    }

    .btn-primary {
      background-color: #7F27FF;
      color: #FFFFFF;
      border: 2px solid #F5E5E1;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }
  </style>
</head>
<body class="bg-matching">
  <div class="container text-center my-5 fade-in">
    <h2 class="mb-3 title-cinematic">🔢 Math Matching Game</h2>
    <p class="fs-5">Click a problem, then click its matching answer!</p>
    <div class="card shadow glass-card p-4 mt-4">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <h4 class="mb-3">Problems</h4>
          <div id="problems" class="d-grid gap-3"></div>
        </div>
        <div class="col-md-5">
          <h4 class="mb-3">Answers</h4>
          <div id="answers" class="d-grid gap-3"></div>
        </div>
      </div>
      <p id="feedback" class="fs-5 mt-4"></p>
      <button onclick="startGame()" class="btn btn-primary btn-lg mt-3">🔁 Restart Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
