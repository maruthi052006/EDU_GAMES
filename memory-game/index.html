<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🧠 Memory Flip Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }

    .fade-in {
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .container {
      max-width: 800px;
      background-color: #F5E5E1;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.2);
      text-align: center;
      color: #7F27FF;
    }

    h2 {
      font-weight: 700;
      color: #7F27FF;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 15px;
      justify-content: center;
    }

    .card {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background-color: #FFFFFF;
      border: 2px solid #F5E5E1;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.4s ease, background-color 0.4s ease;
    }

    .card:hover {
      transform: scale(1.05);
      background-color: #F5E5E1;
    }

    .card.flipped,
    .card.matched {
      background-color: #F5E5E1;
    }

    .card.matched {
      background-color: #FFFFFF;
      pointer-events: none;
    }

    .card::before {
      content: attr(data-value);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      color: #7F27FF;
      visibility: hidden;
    }

    .card.flipped::before,
    .card.matched::before {
      visibility: visible;
    }

    #result {
      font-weight: 600;
      color: #FFFFFF;
    }

    .btn-success {
      background-color: #7F27FF;
      color: #FFFFFF;
      border: 2px solid #F5E5E1;
      transition: 0.3s;
    }

    .btn-success:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }
  </style>
</head>
<body class="fade-in">
  <div class="container">
    <h2 class="mb-3">🧠 Memory Flip Game</h2>
    <p class="fs-5 mb-4">Flip and match the pairs!</p>
    <div id="gameBoard" class="grid"></div>
    <p id="result" class="fs-5 mt-4"></p>
    <button onclick="startGame()" class="btn btn-success mt-3">🔁 Restart</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
