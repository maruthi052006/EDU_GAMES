<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🇮🇳 Freedom Fighters Saga 🇮🇳</title>
  <style>
    /* === GLOBAL THEME === */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #7F27FF; /* main solid background */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      color: #2D2D2D;
    }

    /* === CONTAINER === */
    .container {
      background-color: #FFFFFF; /* white card */
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 600px;
      width: 90%;
      text-align: center;
      animation: fadeIn 1s ease;
    }

    /* === TITLE === */
    h1 {
      color: #7F27FF;
      margin-bottom: 1rem;
      font-size: 2rem;
      font-weight: 700;
    }

    /* === QUESTION === */
    #question {
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      color: #2D2D2D;
      font-weight: 500;
    }

    /* === OPTIONS === */
    .option {
      background-color: #FFFFFF;
      border: 2px solid #7F27FF;
      color: #2D2D2D;
      margin: 0.5rem 0;
      padding: 0.75rem;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      font-weight: 500;
    }

    .option:hover {
      background-color: #7F27FF;
      color: #FFFFFF;
      transform: scale(1.03);
    }

    /* === NEXT BUTTON === */
    #next-btn {
      padding: 10px 25px;
      font-size: 1rem;
      background-color: #7F27FF;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    #next-btn:hover {
      background-color: #F5E5E1;
      color: #2D2D2D;
    }

    /* === SCORE === */
    #score {
      font-size: 1.2rem;
      color: #1ed536;
      margin-top: 1.2rem;
      font-weight: bold;
    }

    /* === ANIMATION === */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇮🇳 Freedom Fighters Saga 🇮🇳</h1>
    <div id="question-container">
      <p id="question">Loading question...</p>
      <div id="options"></div>
    </div>
    <button id="next-btn">Next</button>
    <p id="score"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
