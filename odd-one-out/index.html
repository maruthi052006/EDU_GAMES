<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Odd One Out Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #F5E5E1;
    }

    .fade-in {
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background-color: #7F27FF;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(245, 229, 225, 0.3);
      padding: 2rem;
      border: 2px solid #F5E5E1;
      text-align: center;
    }

    .title-glow {
      color: #F5E5E1;
      text-shadow: 1px 1px 4px #FFFFFF;
    }

    #items {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    #items button {
      font-size: 20px;
      padding: 12px 24px;
      border-radius: 12px;
      border: 2px solid #F5E5E1;
      background-color: #F5E5E1;
      color: #7F27FF;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      font-weight: bold;
    }

    #items button:hover {
      background-color: #FFFFFF;
      transform: scale(1.1);
    }

    #feedback {
      color: #F5E5E1;
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    button.btn-primary {
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      transition: all 0.3s ease;
    }

    button.btn-primary:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body class="fade-in">
  <div class="container text-center my-5 glass-card p-4">
    <h2 class="mb-3 title-glow">🧠 Odd One Out Challenge</h2>
    <p class="fs-5 mb-3">Click the item that doesn’t belong!</p>
    <div id="items"></div>
    <p id="feedback" class="fs-5 mt-4"></p>
    <button onclick="nextSet()" class="btn btn-lg btn-primary mt-3">🔁 Next Set</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
