<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>➕ Number Bonds Challenge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #F5E5E1;
    }

    .fade-in {
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background-color: #7F27FF;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(245, 229, 225, 0.3);
      padding: 2rem;
      border: 2px solid #F5E5E1;
      text-align: center;
    }

    .title-glow {
      color: #F5E5E1;
      text-shadow: 1px 1px 4px #FFFFFF;
    }

    #choices {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .choice-btn {
      width: 80px;
      height: 60px;
      font-size: 22px;
      border-radius: 10px;
      border: 2px solid #F5E5E1;
      background-color: #F5E5E1;
      color: #7F27FF;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    .choice-btn:hover {
      background-color: #FFFFFF;
      transform: scale(1.1);
    }

    #feedback, #selected, p {
      color: #F5E5E1;
    }

    button.btn-primary {
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      transition: all 0.3s ease;
    }

    button.btn-primary:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body class="fade-in">
  <div class="container glass-card">
    <h2 class="mb-3 title-glow">➕ Number Bonds Challenge</h2>
    <p class="fs-5 mb-3">Choose two numbers that make <span id="targetNum">?</span></p>
    <div id="choices"></div>
    <p id="selected" class="mt-3"></p>
    <p id="feedback" class="mt-2 fs-5"></p>
    <button onclick="nextChallenge()" class="btn btn-primary btn-lg mt-3">Next</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
