<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pattern Finder Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* ===== GLOBAL COLOR THEME ===== */
    body {
      background-color: #7F27FF;
      color: #F5E5E1;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.3);
    }

    h1 {
      color: #F5E5E1;
      font-weight: bold;
    }

    .progress {
      background-color: rgba(245, 229, 225, 0.2);
      border-radius: 10px;
    }

    .progress-bar {
      background-color: #F5E5E1 !important;
    }

    .card {
      background-color: transparent;
      border: 2px solid #F5E5E1;
      color: #F5E5E1;
    }

    #puzzle {
      color: #F5E5E1;
    }

    #choices .btn {
      background-color: transparent;
      border: 2px solid #F5E5E1;
      color: #F5E5E1;
      transition: 0.3s;
      border-radius: 10px;
      font-weight: 500;
    }

    #choices .btn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    #feedback {
      color: #F5E5E1;
      font-weight: bold;
    }

    #score-area {
      color: #F5E5E1;
      font-size: 1.2rem;
    }

    .btn-primary {
      background-color: transparent;
      border: 2px solid #F5E5E1;
      color: #F5E5E1;
      transition: 0.3s;
      border-radius: 10px;
    }

    .btn-primary:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    /* ===== Animations ===== */
    .fade-in {
      animation: fadeIn 1.5s ease;
    }

    .slide-up {
      animation: slideUp 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container my-5 text-center fade-in">
    <h1 class="display-4 mb-4 fw-bold">🧠 Pattern Finder</h1>
    
    <div class="progress mb-3" style="height: 20px;">
      <div id="progress-bar" class="progress-bar progress-bar-striped" style="width: 0%"></div>
    </div>

    <div class="card p-4 shadow-lg rounded-4 slide-up">
      <p id="puzzle" class="fs-3 fw-bold">Loading...</p>
      <div id="choices" class="d-grid gap-3 my-4"></div>
      <p id="feedback" class="fs-5"></p>
      <button onclick="nextPuzzle()" class="btn btn-primary mt-3">Next ➔</button>
    </div>

    <div id="score-area" class="mt-4 fs-5">
      Score: <span id="score">0</span> / <span id="total">0</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
