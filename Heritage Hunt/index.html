<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heritage Hunt: Monuments & Culture Quest</title>
  <style>
    /* === GLOBAL THEME === */
    body {
      background-color: #7F27FF;
      color: #F5E5E1;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 20px;
      padding: 30px 40px;
      text-align: center;
      max-width: 700px;
      width: 90%;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.4);
      transition: all 0.3s ease-in-out;
    }

    h1 {
      font-size: 2.5em;
      color: #F5E5E1;
      margin-bottom: 0.2em;
    }

    h3 {
      font-size: 1.5em;
      color: #F5E5E1;
      margin-bottom: 1em;
    }

    #question {
      font-size: 1.3em;
      margin-bottom: 1em;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    button {
      padding: 12px;
      font-size: 1em;
      border: 2px solid #F5E5E1;
      border-radius: 10px;
      cursor: pointer;
      background-color: transparent;
      color: #F5E5E1;
      transition: 0.3s;
    }

    button:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    #next-btn {
      background-color: transparent;
      color: #F5E5E1;
      border: 2px solid #F5E5E1;
      display: none;
    }

    #next-btn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    .correct {
      background-color: #0af40a !important;
      color: #0a0b0a !important;
    }

    .wrong {
      background-color: #d41313 !important;
      color: #0f0b0a !important;
      border: 2px solid #F5E5E1 !important;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="game-container">
    <h1>🏞️ Heritage Hunt</h1>
    <h3>Monuments & Culture Quest</h3>
    <div id="question-container">
      <div id="question">Loading...</div>
      <div id="answer-buttons" class="btn-grid"></div>
    </div>
    <button id="next-btn" class="next-btn btn">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
