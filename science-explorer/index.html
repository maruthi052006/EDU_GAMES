<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔬 Science Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #7F27FF;
      color: #F5E5E1;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(245, 229, 225, 0.3);
      width: 90%;
      max-width: 800px;
      text-align: center;
    }

    .title-glow {
      font-size: 2rem;
      color: #F5E5E1;
      text-shadow: 1px 1px 4px #FFFFFF;
      margin-bottom: 20px;
    }

    #feedback {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #F5E5E1;
    }

    .item, .drop-zone {
      font-size: 18px;
      font-weight: 500;
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #F5E5E1;
      background-color: #F5E5E1;
      color: #7F27FF;
      cursor: grab;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .item.dragging {
      opacity: 0.5;
    }

    .drop-zone.correct {
      background-color: #F5E5E1 !important;
      border-color: #FFFFFF;
      color: #7F27FF;
    }

    .drop-zone.wrong {
      background-color: #F5E5E1 !important;
      border-color: #FF4D6D;
      color: #7F27FF;
    }

    .btn-success {
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #FFFFFF;
      font-weight: bold;
      margin-top: 20px;
    }

    .btn-success:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }
  </style>
</head>
<body class="fade-in">
  <div class="container my-5 glass-card p-4">
    <h2 class="title-glow">🔬 Science Explorer</h2>
    <p class="fs-5 mb-4">Drag the science object to the correct description below.</p>

    <div class="row">
      <div class="col-md-6">
        <h5 class="mb-3">🔧 Objects</h5>
        <div id="items" class="d-flex flex-column gap-3"></div>
      </div>

      <div class="col-md-6">
        <h5 class="mb-3">🧪 Drop Zones</h5>
        <div id="dropzones" class="d-flex flex-column gap-3"></div>
      </div>
    </div>

    <div id="feedback">Match all correctly to win!</div>
    <button class="btn btn-success" onclick="initGame()">🔁 Restart</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
