<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>அகராதி ஆராய்ச்சி</title>
  <style>
    /* Global body settings */
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      background-color: #7F27FF; /* main solid background */
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #FFFFFF;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background-color: #F5E5E1; /* container base color */
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255,255,255,0.3);
      color: #7F27FF;
    }

    h1 {
      color: #FFFFFF;
      font-size: 2.5em;
      text-shadow: 1px 1px 4px #F5E5E1;
    }

    .instruction {
      font-size: 1.2em;
      color: #FFFFFF;
    }

    #gameArea {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
    }

    .column {
      width: 40%;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background-color: #FFFFFF; /* list items base */
      color: #7F27FF;
      margin: 10px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2em;
      transition: background 0.3s, color 0.3s;
    }

    li:hover {
      background-color: #F5E5E1; /* hover accent */
      color: #7F27FF;
    }

    #feedback {
      margin: 20px;
      font-size: 1.5em;
      font-weight: bold;
      color: #FFFFFF;
      text-shadow: 1px 1px 2px #F5E5E1;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      background: #FFFFFF; /* button base */
      color: #7F27FF;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, transform 0.2s;
    }

    button:hover {
      background: #F5E5E1; /* hover accent */
      color: #7F27FF;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>அகராதி ஆராய்ச்சி</h1>
    <p class="instruction">சொல்லும் பொருளையும் பொருத்துங்கள்!</p>
    
    <div id="gameArea">
      <div class="column words">
        <h3>சொற்கள்</h3>
        <ul id="wordsList"></ul>
      </div>
      <div class="column meanings">
        <h3>பொருள்கள்</h3>
        <ul id="meaningsList"></ul>
      </div>
    </div>

    <div id="feedback"></div>
    <button>புதிய வார்த்தைகள்</button>
  </div>
</body>
</html>
