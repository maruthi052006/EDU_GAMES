<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Natural Wonders Quest: Earth’s Marvels</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #7F27FF;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #FFFFFF;
    }

    .quiz-container {
      background-color: #7F27FF;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 10px 25px rgba(245, 229, 225, 0.3);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .title {
      font-size: 2em;
      color: #F5E5E1;
      margin-bottom: 20px;
    }

    #question {
      font-size: 1.3em;
      margin: 20px 0;
      color: #F5E5E1;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin: 20px 0;
    }

    button {
      padding: 12px;
      font-size: 1em;
      border-radius: 8px;
      border: 2px solid #F5E5E1;
      cursor: pointer;
      background-color: #7F27FF;
      color: #F5E5E1;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    .next-btn {
      margin-top: 10px;
      background-color: #F5E5E1;
      color: #7F27FF;
      border: 2px solid #F5E5E1;
    }

    .next-btn:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
    }

    .hidden {
      display: none;
    }

    .correct {
      background-color: #F5E5E1;
      color: #7F27FF;
      font-weight: bold;
    }

    .wrong {
      background-color: #FFFFFF;
      color: #7F27FF;
      font-weight: bold;
    }

    #score-section {
      margin-top: 20px;
      animation: popIn 0.8s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1 class="title">🌋 Natural Wonders Quest: Earth’s Marvels</h1>
    <div id="question-container">
      <div id="question">Loading question...</div>
      <div id="answer-buttons" class="btn-grid"></div>
    </div>
    <div class="controls">
      <button id="next-btn" class="next-btn">Next</button>
    </div>
    <div id="score-section" class="hidden">
      <h2>🎉 Quest Completed!</h2>
      <p id="score-text"></p>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
