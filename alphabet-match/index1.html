<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alphabet Match Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Global styles */
    body {
      background-color: #7F27FF;
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #FFFFFF;
    }

    /* Hero Header */
    .hero-header {
      padding: 80px 20px 40px;
      background-color: #7F27FF;
      border-bottom: 3px solid #F5E5E1;
      box-shadow: 0 0 25px rgba(245, 229, 225, 0.4);
    }

    .hero-header h1 {
      color: #FFFFFF;
    }

    .hero-header p {
      color: #F5E5E1;
    }

    /* Main Container */
    .container {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.4);
    }

    /* Letter Boxes */
    .glass-box {
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.2);
    }

    .drag-box, .drop-box {
      width: 60px;
      height: 60px;
      font-size: 24px;
      font-weight: bold;
      line-height: 60px;
      border-radius: 12px;
      text-align: center;
      cursor: grab;
      transition: all 0.3s ease;
    }

    .drag-box {
      background-color: #F5E5E1;
      border: 2px solid #FFFFFF;
      color: #7F27FF;
    }

    .drop-box {
      background-color: #7F27FF;
      border: 2px dashed #F5E5E1;
      color: #FFFFFF;
    }

    .drag-box:hover, .drop-box:hover {
      transform: scale(1.1);
    }

    .drag-box.dragging {
      opacity: 0.6;
    }

    .drop-box.correct {
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }

    .drop-box.wrong {
      background-color: #FFFFFF;
      color: #7F27FF;
      border-color: #F5E5E1;
    }

    /* Animations */
    .animate-fade {
      animation: fadeIn 1.5s ease;
    }

    .animate-slide {
      animation: slideUp 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .footer {
      padding: 20px;
      font-size: 14px;
      background-color: #7F27FF;
      color: #F5E5E1;
      border-top: 2px solid #F5E5E1;
    }

    /* Progress and Button */
    #progress {
      color: #FFFFFF;
    }

    button.btn {
      border: 2px solid #FFFFFF;
      color: #7F27FF;
      background-color: #F5E5E1;
      transition: all 0.3s ease;
    }

    button.btn:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
      border-color: #F5E5E1;
    }
  </style>
</head>
<body>
  <div class="hero-header text-center">
    <h1 class="display-4 fw-bold animate-fade">🔠 Alphabet Match</h1>
    <p class="lead animate-slide">Match uppercase and lowercase letters with a fun drag-and-drop game!</p>
  </div>

  <div class="container py-4 text-center animate-fade">
    <div class="mb-3 fs-5" id="progress">0 / 26 Matched</div>

    <div class="row">
      <div class="col-md-6">
        <h4 class="mb-3" style="color:#F5E5E1;">🎈 Uppercase Letters</h4>
        <div class="glass-box p-3 d-flex flex-wrap justify-content-center gap-3" id="draggables">
          <!-- Uppercase letters generated by JS -->
        </div>
      </div>
      <div class="col-md-6">
        <h4 class="mb-3" style="color:#F5E5E1;">🎯 Lowercase Drop Zones</h4>
        <div class="glass-box p-3 d-flex flex-wrap justify-content-center gap-3" id="dropzones">
          <!-- Lowercase drop zones generated by JS -->
        </div>
      </div>
    </div>

    <div id="result" class="fs-4 mt-4"></div>
    <button class="btn mt-4" onclick="resetGame()">🔁 Play Again</button>
  </div>

  <footer class="footer text-center">
    © 2025 Alphabet Match | Fun with Letters 🎉
  </footer>

  <script src="script.js"></script>
</body>
</html>
