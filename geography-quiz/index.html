<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌍 Geography Quiz Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* === Global Theme === */
    body {
      background-color: #7F27FF;
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      color: #FFFFFF;
    }

    /* === Hero Section === */
    .hero {
      background-color: #7F27FF;
      color: #FFFFFF;
      text-align: center;
      padding: 3rem 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    .hero h1 {
      color: #F5E5E1;
      font-weight: bold;
    }

    .hero p {
      color: #FFFFFF;
      font-size: 1.1rem;
    }

    /* === Quiz Card === */
    .quiz-card {
      border-radius: 16px;
      background-color: #7F27FF;
      color: #FFFFFF;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: all 0.3s ease;
      border: 2px solid #F5E5E1;
      text-align: center;
    }

    #options .btn {
      width: 100%;
      max-width: 500px;
      margin: auto;
      color: #7F27FF;
      background-color: #F5E5E1;
      border: 2px solid #FFFFFF;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
    }

    #options .btn:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
      transform: scale(1.05);
      border-color: #F5E5E1;
    }

    /* === Result Feedback === */
    #result {
      min-height: 40px;
      color: #F5E5E1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* Optional: colors for correct/wrong feedback */
    .correct {
      color: #00FFB2;
      text-shadow: 0 0 10px rgba(0,255,178,0.6);
    }

    .wrong {
      color: #FF6B6B;
      text-shadow: 0 0 10px rgba(255,107,107,0.6);
    }

    .btn-primary {
      background-color: #F5E5E1 !important;
      color: #7F27FF !important;
      border: 2px solid #FFFFFF !important;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #FFFFFF !important;
      color: #7F27FF !important;
      border-color: #F5E5E1 !important;
    }

    footer {
      color: #F5E5E1;
      text-align: center;
      padding: 1rem 0;
      background-color: #7F27FF;
      border-top: 1px solid #F5E5E1;
    }

    /* === Animations === */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>
  <!-- Hero Header -->
  <section class="hero">
    <div class="container">
      <h1 class="display-4">🌐 Geography Quiz Challenge</h1>
      <p class="lead">Learn world capitals, landmarks, and continents — in a fun way!</p>
    </div>
  </section>

  <!-- Main Quiz Container -->
  <main class="container my-5">
    <div class="card quiz-card p-4 shadow-lg">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span>Question <span id="current-number">1</span> of <span id="total-questions">250</span></span>
        <span>Score: <span id="score">0</span></span>
      </div>

      <h4 id="question" class="mb-4">Loading question...</h4>
      <div id="options" class="d-grid gap-3"></div>

      <div id="result" class="mt-3 fs-5 fw-bold"></div>
      <button onclick="nextQuestion()" class="btn btn-primary mt-4">Next Question</button>
    </div>
  </main>

  <footer>
    © 2025 GeoQuiz • Learn with Adventure 🧭
  </footer>

  <script src="script.js"></script>
</body>
</html>
