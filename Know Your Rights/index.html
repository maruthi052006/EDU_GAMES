<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Know Your Rights</title>
  <style>
    /* ===== GLOBAL COLOR THEME ===== */
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #7F27FF;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #F5E5E1;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 30px;
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.3);
    }

    h1 {
      color: #F5E5E1;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      color: #F5E5E1;
      margin-bottom: 30px;
    }

    .quiz-area {
      transition: all 0.3s ease;
    }

    .question {
      font-size: 1.5em;
      margin-bottom: 25px;
      color: #F5E5E1;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 12px 20px;
      font-size: 1em;
      border-radius: 12px;
      border: 2px solid #F5E5E1;
      background-color: transparent;
      color: #F5E5E1;
      cursor: pointer;
      transition: 0.3s;
    }

    .option-btn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
      transform: scale(1.03);
    }

    .option-btn.correct {
      background-color: #F5E5E1 !important;
      color: #7F27FF !important;
      border-color: #F5E5E1 !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: transparent !important;
      color: #F5E5E1 !important;
      opacity: 0.6;
      border-style: dashed;
      font-weight: bold;
    }

    .feedback {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 15px;
      color: #F5E5E1;
    }

    .next-btn {
      padding: 10px 20px;
      font-size: 1em;
      border: 2px solid #F5E5E1;
      border-radius: 10px;
      background-color: transparent;
      color: #F5E5E1;
      cursor: pointer;
      transition: 0.3s;
    }

    .next-btn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✋ Know Your Rights</h1>
    <p>Learn your rights and duties as a responsible citizen of India!</p>

    <div class="quiz-area">
      <div id="question" class="question">Question will appear here</div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="next-btn">Next</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
