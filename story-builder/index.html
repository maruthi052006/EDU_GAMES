<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Story Builder Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Global body settings */
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #7F27FF; /* solid main background */
      margin: 0;
      padding: 20px;
      color: #FFFFFF;
    }

    .container {
      background-color: #F5E5E1; /* container base color */
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(255,255,255,0.3);
      color: #7F27FF;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      color: #FFFFFF;
      text-shadow: 1px 1px 4px #F5E5E1;
    }

    label {
      color: #FFFFFF;
      font-weight: 600;
    }

    select.form-select {
      background-color: #FFFFFF;
      color: #7F27FF;
      border: 1px solid #FFFFFF;
      border-radius: 8px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    select.form-select:hover, select.form-select:focus {
      background-color: #F5E5E1;
      color: #7F27FF;
    }

    button.btn-success {
      background-color: #FFFFFF;
      color: #7F27FF;
      font-weight: bold;
      border-radius: 10px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button.btn-success:hover {
      background-color: #F5E5E1;
      transform: scale(1.05);
    }

    .story-box {
      display: none;
      background-color: #FFFFFF;
      border-left: 5px solid #7F27FF;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      color: #7F27FF;
      transition: all 0.4s ease-in-out;
    }

    #story {
      font-style: italic;
      color: #7F27FF;
    }
  </style>
</head>
<body>
  <div class="container my-5">
    <h2 class="text-center display-5 fw-bold mb-4">📖 Story Builder</h2>

    <div class="row g-4">
      <div class="col-md-4">
        <label class="form-label">Choose a Character:</label>
        <select id="character" class="form-select"></select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Choose a Setting:</label>
        <select id="setting" class="form-select"></select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Choose an Action:</label>
        <select id="action" class="form-select"></select>
      </div>
    </div>

    <div class="text-center mt-4">
      <button class="btn btn-success btn-lg px-4">🎬 Generate Story</button>
    </div>

    <div class="story-box text-center">
      <h4 class="mb-3">Your Story:</h4>
      <p id="story" class="fs-5"></p>
    </div>
  </div>
</body>
</html>
