<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alphabet Sorting Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <style>
    /* Global Styles */
    body {
      font-family: 'Comic Sans MS', cursive;
      margin: 0;
      background-color: #7F27FF;
      color: #FFFFFF;
      overflow-x: hidden;
    }

    /* Hero Section */
    .hero {
      padding: 80px 20px 40px;
      background-color: #7F27FF;
      border-bottom: 3px solid #F5E5E1;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.4);
    }

    .hero h1 {
      color: #FFFFFF;
    }

    .hero p {
      color: #F5E5E1;
    }

    /* Level Buttons */
    .level-buttons .btn {
      border: 2px solid #F5E5E1;
      background-color: #7F27FF;
      color: #FFFFFF;
      transition: all 0.3s ease;
    }

    .level-buttons .btn:hover {
      background-color: #F5E5E1;
      color: #7F27FF;
      border-color: #FFFFFF;
    }

    /* Sortable Area */
    #sortable {
      min-height: 100px;
      padding: 20px;
      background-color: #7F27FF;
      border: 2px solid #F5E5E1;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(245, 229, 225, 0.3);
      transition: all 0.4s ease-in-out;
    }

    /* Letter Tiles */
    .letter-tile {
      width: 60px;
      height: 60px;
      font-size: 26px;
      font-weight: bold;
      line-height: 60px;
      text-align: center;
      border-radius: 10px;
      background-color: #F5E5E1;
      border: 2px solid #FFFFFF;
      color: #7F27FF;
      cursor: grab;
      transition: all 0.3s ease;
    }

    .letter-tile:hover {
      transform: scale(1.1);
      background-color: #FFFFFF;
      color: #7F27FF;
    }

    /* Buttons */
    button.btn {
      border: 2px solid #F5E5E1;
      color: #7F27FF;
      background-color: #F5E5E1;
      transition: all 0.3s ease;
    }

    button.btn:hover {
      background-color: #FFFFFF;
      color: #7F27FF;
      border-color: #F5E5E1;
    }

    /* Feedback */
    #feedback {
      color: #FFFFFF;
      font-weight: bold;
    }

    /* Footer */
    footer {
      background-color: #7F27FF;
      color: #F5E5E1;
      border-top: 2px solid #F5E5E1;
      padding: 20px;
      font-size: 14px;
    }

    /* Animations */
    .animate-fade {
      animation: fadeIn 1.2s ease-in-out;
    }

    .animate-slide {
      animation: slideUp 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <section class="hero text-center">
    <div class="container">
      <h1 class="display-4 fw-bold animate-fade">🔤 Alphabet Sorting</h1>
      <p class="lead animate-slide">Drag and sort the letters in the correct alphabetical order!</p>

      <div class="level-buttons my-4">
        <button class="btn" onclick="startGame(6)">🟢 Easy (A–F)</button>
        <button class="btn" onclick="startGame(13)">🟡 Medium (A–M)</button>
        <button class="btn" onclick="startGame(26)">🔴 Full (A–Z)</button>
      </div>
    </div>
  </section>

  <div class="container text-center my-5 animate-fade">
    <div id="sortable" class="d-flex justify-content-center flex-wrap gap-3 mb-4"></div>

    <button onclick="checkOrder()" class="btn px-4">✅ Check</button>
    <p id="feedback" class="fs-5 mt-3"></p>
    <button onclick="shuffleAgain()" class="btn mt-3">🔁 Shuffle Again</button>
  </div>

  <footer class="text-center">
    © 2025 Alphabet Sorting Game • Learn With Fun 🎓
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
